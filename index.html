<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <!-- Premium SEO Architecture -->
  <title>AlurKarya - Private Workspace & Kanban Dashboard</title>
  <meta name="description" content="AlurKarya is an ultra-premium visual Kanban dashboard designed for creative freelancers, developers, and consultants. Manage your clients, track delivery checklists, monitor revision cycles, log invoices, and curate stunning portfolio case studies.">
  <meta name="keywords" content="freelancer project board, trello for freelancers, client revisions tracker, freelance invoicing planner, visual workspace tools">
  <meta name="author" content="Antigravity Studio">
  
  <!-- OpenGraph Visual Metadata -->
  <meta property="og:title" content="AlurKarya - Private Workspace & Kanban Dashboard">
  <meta property="og:description" content="Manage your clients, due dates, revision rounds, files, and billing operations in one premium private workspace.">
  <meta property="og:type" content="website">
  
  <!-- Fonts Preconnect & Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <script>
    (function() {
      let bootCompleted = false;
      let fallbackTriggered = false;

      // Timeout of 9 seconds (between 8 and 10 seconds)
      const BOOT_TIMEOUT = 9000; 

      const timeoutId = setTimeout(function() {
        if (!bootCompleted) {
          showBootError("Application took too long to load.");
        }
      }, BOOT_TIMEOUT);

      function showBootError(reason) {
        if (fallbackTriggered) return;
        fallbackTriggered = true;
        bootCompleted = true;
        clearTimeout(timeoutId);

        console.error('[ALURKARYA_BOOT_ERROR] Boot failure:', reason);

        const root = document.getElementById('app-root');
        if (!root) return;

        root.className = '';
        root.style.cssText = 'min-height: 100vh; background: radial-gradient(circle at 50% 50%, hsl(224, 45%, 6%) 0%, hsl(224, 60%, 2%) 100%); color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;';
        
        const isIndo = navigator.language && navigator.language.toLowerCase().startsWith('id');
        const titleText = isIndo ? "Oops! Terjadi kesalahan booting" : "Oops! Booting error occurred";
        const descText = isIndo 
          ? "Kami gagal menyiapkan workspace Anda. Silakan coba muat ulang halaman atau atur ulang mode masuk."
          : "We failed to prepare your workspace. Please try reloading the page or resetting your entry mode.";
        const reloadBtnText = isIndo ? "Muat Ulang" : "Reload";
        const resetBtnText = isIndo ? "Kembali ke Awal" : "Back to Home";

        root.innerHTML = `
          <div style="width: min(90vw, 480px); background: rgba(11, 17, 32, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 40px 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px; box-sizing: border-box; position: relative; overflow: hidden;">
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #6D5DFB, #9B5CFF);"></div>
            <div style="font-size: 3rem; filter: drop-shadow(0 4px 12px rgba(239, 68, 68, 0.3));">⚠️</div>
            <h2 style="font-size: 1.25rem; font-weight: 800; color: #f8fafc; margin: 0; font-family: system-ui, -apple-system, sans-serif;">${titleText}</h2>
            <p style="font-size: 0.85rem; color: #94a3b8; margin: 0; line-height: 1.6; font-family: system-ui, -apple-system, sans-serif;">${descText}</p>
            <div style="display: flex; gap: 12px; width: 100%; flex-wrap: wrap; justify-content: center; margin-top: 8px;">
              <button id="boot-btn-reload" style="flex: 1; min-width: 140px; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; background: linear-gradient(135deg, #6D5DFB, #8b5cf6); color: white; border: none; cursor: pointer; transition: all 0.2s ease;">${reloadBtnText}</button>
              <button id="boot-btn-reset" style="flex: 1; min-width: 140px; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; background: rgba(255,255,255,0.05); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: all 0.2s ease;">${resetBtnText}</button>
            </div>
          </div>
        `;

        document.getElementById('boot-btn-reload').addEventListener('click', function() {
          window.location.reload();
        });
        document.getElementById('boot-btn-reset').addEventListener('click', function() {
          localStorage.removeItem('alurkarya_entry_mode');
          sessionStorage.clear();
          window.location.reload();
        });
      }

      window.addEventListener('alurkarya:ready', function() {
        bootCompleted = true;
        clearTimeout(timeoutId);
      });

      window.addEventListener('alurkarya:boot-error', function(e) {
        showBootError(e.detail ? e.detail.message : 'Unknown initialization error');
      });

      window.addEventListener('error', function(event) {
        if (!bootCompleted) {
          showBootError(event.error ? event.error.message : event.message);
        }
      });

      window.addEventListener('unhandledrejection', function(event) {
        if (!bootCompleted) {
          showBootError(event.reason ? event.reason.message : 'Unhandled promise rejection');
        }
      });
    })();
  </script>

  <!-- Accessibility Hidden Header for SEO Parsing -->
  <h1 class="d-none">AlurKarya - Ultimate Workspace Dashboard</h1>

  <!-- Primary React-like Application Root Mounting Container -->
  <div id="app-root">
    <div id="app-booting-screen" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: sans-serif; gap: 14px;">
      <div style="width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top-color: #8b5cf6; animation: spin 1s linear infinite;"></div>
      <span style="font-weight: 500; font-size: 0.95rem; letter-spacing: 0.05em; color: #94a3b8;">Preparing your workspace...</span>
    </div>
  </div>

  <!-- Loading Animation Styling Block -->
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Modular Main Orchestration Script Loading -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
